name: OpenSandbox Integration

# Dispatches OpenSandbox's "Fast Sandbox Integration Tests" KVM workflow with
# the PR head SHA, then waits for that run and mirrors its conclusion, so this
# check is the real merge gate. pull_request_target keeps the workflow file and
# secrets on the base branch (PRs can't rewrite the guard or mint tokens); the
# jobs only call the API, never check out PR code. Authors without repository
# write access need a maintainer-added `ok-to-test` label — their code runs on
# a self-hosted runner. Requires OSB_APP_ID / OSB_APP_PRIVATE_KEY (GitHub App with Contents
# read/write + Actions read, installed on the OpenSandbox repo only).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      fsb_commit:
        description: 'fast-sandbox commit to test on OpenSandbox (default: current ref head)'
        required: false
        type: string

concurrency:
  group: opensandbox-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize OpenSandbox integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Check PR author's repository permission
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'ok-to-test') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$APPROVED" == "true" ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
            echo 'Integration authorized by manual dispatch or ok-to-test label.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          : "${PR_AUTHOR:?Missing PR author}"
          response="$RUNNER_TEMP/integration-permission.json"
          status="$(curl -sS --connect-timeout 10 --max-time 60 --retry 2 \
            -o "$response" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR/permission")"
          case "$status" in
            200) permission="$(jq -er '.permission | select(type == "string")' "$response")" ;;
            404) permission=none ;;
            *) echo "::error::Cannot determine PR author permission (HTTP $status)"; exit 1 ;;
          esac

          allowed=false
          case "$permission" in
            admin|maintain|write) allowed=true ;;
          esac
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "PR author $PR_AUTHOR: repository permission=$permission; integration allowed=$allowed." >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: OpenSandbox integration (KVM)
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    # Remote run caps at 180min plus queue time on the single KVM runner.
    timeout-minutes: 330
    env:
      FSB_COMMIT: ${{ inputs.fsb_commit || github.event.pull_request.head.sha }}
      OSB_RUNS: https://api.github.com/repos/opensandbox-group/OpenSandbox/actions
    steps:
      - name: Mint GitHub App installation token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.OSB_APP_ID }}
          private-key: ${{ secrets.OSB_APP_PRIVATE_KEY }}
          owner: opensandbox-group
          repositories: OpenSandbox

      - name: Dispatch and wait for the OpenSandbox KVM run
        env:
          OSB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "fast-sandbox @ ${FSB_COMMIT:-<pinned>}"
          dispatch_ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $OSB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/opensandbox-group/OpenSandbox/dispatches \
            -d '{"event_type":"fast-sandbox-pr","client_payload":{"fsb_commit":"'"$FSB_COMMIT"'","pr":"'"$PR_NUMBER"'"}}'
          echo "dispatched at $dispatch_ts; waiting for the run (poll every 60s)"

          run_id=""
          while (( SECONDS < 19200 )); do
            run_id="$(curl -sSf -H "Authorization: Bearer $OSB_TOKEN" \
              "$OSB_RUNS/workflows/fast-sandbox-test.yml/runs?event=repository_dispatch&per_page=30" |
              jq -r --arg t "$dispatch_ts" '
                [.workflow_runs[] | select(.created_at >= $t)]
                | sort_by(.created_at) | .[0].id // empty')"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 60
          done
          [[ -n "$run_id" ]] || { echo "::error::no dispatched run appeared"; exit 1; }
          echo "tracking run https://github.com/opensandbox-group/OpenSandbox/actions/runs/$run_id (poll every 90s)"

          # Anonymous (the token expires after 1h; 90s polls stay under the
          # 60 req/h unauthenticated limit). Assign first so curl errors
          # fail the step instead of being swallowed by read.
          while (( SECONDS < 19200 )); do
            body="$(curl -sSf --retry 5 --retry-all-errors --retry-delay 15 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$OSB_RUNS/runs/$run_id" | jq -r '[.status, .conclusion] | join(" ")')"
            read -r status conclusion <<<"$body"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "OpenSandbox KVM integration passed"
                exit 0
              fi
              echo "::error::OpenSandbox KVM integration concluded: $conclusion"
              echo "https://github.com/opensandbox-group/OpenSandbox/actions/runs/$run_id"
              exit 1
            fi
            echo "run $run_id: $status"
            sleep 90
          done
          echo "::error::timed out waiting for the OpenSandbox run"
          exit 1
