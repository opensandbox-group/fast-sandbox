apiVersion: v1
kind: ConfigMap
metadata:
  name: fast-sandbox-runtime-environments
  namespace: fast-sandbox-system
data:
  runtime-environments.yaml: |
    version: v1alpha2
    environments:
      default:
        containerd:
          socket: /run/containerd/containerd.sock
          namespace: k8s.io
          defaultSnapshotter: overlayfs
          root: /var/lib/containerd
        kubelet:
          root: /var/lib/kubelet
        runtimes:
          container: {}
          gvisor: {}
          kata-qemu: {}
          kata-clh: {}
          kata-fc:
            snapshotter: blockfile
            configPath: /opt/kata/share/defaults/kata-containers/configuration-fc-fast-sandbox.toml
          kata-dragonball:
            configPath: /opt/kata/share/defaults/kata-containers/runtime-rs/configuration-dragonball-fast-sandbox.toml
          boxlite: {}
          # Firecracker on-demand loading: the node-level runtime-agent pulls
          # the golden snapshot set from the artifact store into StateRoot,
          # and the driver restores every Sandbox from it (jailer mode with
          # per-clone netns). The binary/jailer/kernel are installed on the
          # node by the agent's readiness loop (hostready: host checks +
          # asset install + node labels); the paths below are the
          # environment-side installation values.
          firecracker:
            firecracker:
              binaryPath: /opt/fast-sandbox/firecracker/firecracker
              jailerPath: /opt/fast-sandbox/firecracker/jailer
              kernelPath: /opt/fast-sandbox/firecracker/vmlinux.bin
              rootfsPath: /var/lib/fast-sandbox/firecracker/rootfs
              stateRoot: /var/lib/fast-sandbox/firecracker
