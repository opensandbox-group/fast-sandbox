# agent-daemonset.yaml — node-level firecracker runtime-agent.
#
# Serves the UDS management API (artifact pull + lease state) that the
# fastlet firecracker driver talks to. The socket directory and the state
# root are shared with fastlet pods via hostPath.
#
# Prerequisites (created by scripts/integration-env.sh):
#   - ConfigMap fast-sandbox-artifact-store: the shared store root/endpoint
#     (config/artifact-store) the agent pulls from.
#   - Secret fast-sandbox-agent-registry: the compiled registry
#     configuration (registryconfig.Compiled JSON) whose credential carries
#     the MinIO read-only key matching the mounted store endpoint.
#
# Apply with:
#   kubectl apply -f config/dev/agent-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: firecracker-runtime-agent
  namespace: fast-sandbox-system
  labels:
    app: fast-sandbox
    component: firecracker-runtime-agent
spec:
  selector:
    matchLabels:
      app: fast-sandbox
      component: firecracker-runtime-agent
  template:
    metadata:
      labels:
        app: fast-sandbox
        component: firecracker-runtime-agent
    spec:
      nodeSelector:
        fast-sandbox.io/firecracker-node: "true"
      # The agent runs on the cluster network (NOT hostNetwork): its dart
      # child needs the cluster DNS (CoreDNS search domains) to resolve the
      # headless Service peers. It talks to fastlets over the shared UDS
      # hostPath and to MinIO over the cluster network, so no host network
      # capability is required. The node hostname file is mounted read-only
      # for the stable HRW self-id (hostNetwork used to provide it via the
      # node UTS namespace; a regular pod's hostname is its pod name).
      containers:
      - name: agent
        image: fast-sandbox/firecracker-runtime-agent:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: FAST_SANDBOX_RUNTIME_AGENT_SOCKET
          value: /run/fast-sandbox/firecracker/runtime.sock
        # Artifact store: the fast-sandbox-artifact-store ConfigMap is mounted
        # below and read per pull, so an edit applies without a restart.
        - name: FAST_SANDBOX_STATE_ROOT
          value: /var/lib/fast-sandbox/firecracker
        - name: FAST_SANDBOX_REGISTRY_CONFIG_PATH
          value: /etc/fast-sandbox/agent/registry.json
        # DART P2P gateway (stage 2): non-empty enables the node-local DART
        # child process and routes artifact pulls through its prefix API.
        # The image carries the pinned dart binary; see
        # build/Dockerfile.firecracker-runtime-agent.
        - name: FAST_SANDBOX_DART_ADDR
          value: http://127.0.0.1:8145
        # Peer discovery via the headless Service (config/dev/dart-service.yaml);
        # the FQDN resolves on the cluster network. The agent falls back to
        # direct S3 when DART is unreachable.
        - name: FAST_SANDBOX_DART_DISCOVER
          value: dns:dart.fast-sandbox-system.svc.cluster.local:9000
        # Regular pods get their own cluster IP; the dart peer-listen binds
        # it and the headless Service hands it out to peers.
        - name: FAST_SANDBOX_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        securityContext:
          privileged: true
        readinessProbe:
          exec:
            command: ["/bin/sh", "-ec", "curl -fsS -X POST --unix-socket /run/fast-sandbox/firecracker/runtime.sock -H 'Content-Type: application/json' -d '{\"podUid\":\"$POD_UID\",\"namespace\":\"fast-sandbox-system\"}' http://firecracker-agent/v1/health | grep -q '\"ok\":true'"]
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: agent-socket
          mountPath: /run/fast-sandbox/firecracker
        - name: agent-state
          mountPath: /var/lib/fast-sandbox/firecracker
        - name: agent-registry
          mountPath: /etc/fast-sandbox/agent
          readOnly: true
        - name: artifact-store
          mountPath: /etc/fast-sandbox/artifact-store
          readOnly: true
        - name: node-hostname
          mountPath: /etc/hostname
          readOnly: true
      volumes:
      - name: agent-socket
        hostPath:
          path: /run/fast-sandbox/firecracker
          type: DirectoryOrCreate
      - name: agent-state
        hostPath:
          path: /var/lib/fast-sandbox/firecracker
          type: DirectoryOrCreate
      - name: agent-registry
        secret:
          secretName: fast-sandbox-agent-registry
      # Shared artifact store root/endpoint, read per pull (live ConfigMap
      # edits land without an agent restart).
      - name: artifact-store
        configMap:
          name: fast-sandbox-artifact-store
          optional: true
      # The stable node identity for the HRW keyspace (hostNetwork used to
      # provide it through the node UTS namespace).
      - name: node-hostname
        hostPath:
          path: /etc/hostname
          type: File
