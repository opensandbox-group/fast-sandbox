# agent-daemonset.yaml — node-level firecracker runtime + readiness agent,
# with the node janitor as a sidecar container.
#
# Pod layout (two containers, one node daemon):
#   1. firecracker-agent — serves the UDS management API (artifact pull +
#      lease state) the fastlet firecracker driver talks to, and runs the
#      node readiness loop (the kata-deploy pattern): host checks,
#      Firecracker asset install, the scheduling labels
#      (sandbox.fast.io/kvm + fast-sandbox.io/firecracker-node) and the
#      FirecrackerReady condition, plus the snapshot CPU compatibility
#      labels sandbox.fast.io/cpu-template (T2 / T2A / none — which golden
#      snapshot tiers the node restores) and, on none-tier nodes,
#      sandbox.fast.io/cpu-identity (vendor-family-model; see
#      docs/guides/snapshot-cpu-compatibility.md). scripts/
#      firecracker-host-check.sh runs the same checks standalone.
#   2. janitor — sweeps orphaned node resources: fastlet network state
#      (netns/tap/veth), boxlite leftovers, and leaked VMM processes
#      fastlets delegate over the node-cleanup UDS socket (needs the pod's
#      hostPID visibility). The containerd backend is disabled here; the
#      standalone config/janitor DaemonSet covers the containerd-based
#      runtimes.
#
# All agent tunables live in the agent config ConfigMap
# (config/dev/agent-config.yaml, mounted at /etc/fast-sandbox/agent-config/
# agent.yaml; the nodeReadiness section hot-reloads per pass). The
# environment below carries only the Downward API identities.
#
# The DaemonSet intentionally carries NO firecracker nodeSelector: the
# agent is the component that applies those labels, so it must run on every
# candidate node (pin it with your own coarse selector if the cluster hosts
# unrelated node pools). The control-plane toleration keeps single-node
# clusters servable.
#
# Degraded-host window (inherent to the kata-deploy pattern): the labels
# persist while the agent is NOT running — a dead/evicted agent pod or
# nodeReadiness.enabled=false leaves the last-applied labels in place and
# fastlets keep scheduling there. Keep the DaemonSet healthy; the recheck
# only protects against a running-but-degraded host.
#
# Prerequisites (created by scripts/integration-env.sh):
#   - ConfigMap fast-sandbox-firecracker-runtime-config: the agent config
#     (config/dev/agent-config.yaml).
#   - ConfigMap fast-sandbox-artifact-store: the shared store root/endpoint
#     (config/artifact-store) the agent pulls from.
#   - Secret fast-sandbox-agent-registry: the compiled registry
#     configuration (registryconfig.Compiled JSON) whose credential carries
#     the MinIO read-only key matching the mounted store endpoint.
#
# Apply with:
#   kubectl apply -f config/dev/agent-config.yaml
#   kubectl apply -f config/dev/agent-daemonset.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fast-sandbox-firecracker-runtime
  namespace: fast-sandbox-system
  labels:
    app: fast-sandbox
    component: firecracker-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fast-sandbox-firecracker-runtime
  labels:
    app: fast-sandbox
    component: firecracker-runtime
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/status"]
  # The readiness manager reads the node to diff its labels/condition and
  # patches metadata + the status subresource (the FirecrackerReady
  # condition lives under nodes/status, a separate RBAC resource from
  # plain nodes).
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  # The janitor sidecar's pod informer tracks this node's pods to detect
  # orphans the moment their pod disappears.
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fast-sandbox-firecracker-runtime
  labels:
    app: fast-sandbox
    component: firecracker-runtime
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fast-sandbox-firecracker-runtime}
subjects:
- {kind: ServiceAccount, name: fast-sandbox-firecracker-runtime, namespace: fast-sandbox-system}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: firecracker-runtime
  namespace: fast-sandbox-system
  labels:
    app: fast-sandbox
    component: firecracker-runtime
spec:
  selector:
    matchLabels:
      app: fast-sandbox
      component: firecracker-runtime
  template:
    metadata:
      labels:
        app: fast-sandbox
        component: firecracker-runtime
      annotations:
        # The janitor sidecar's Prometheus metrics (node cleanup stats).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        prometheus.io/path: /metrics
        # Plain `kubectl logs/exec` on this multi-container pod targets the
        # agent without needing -c.
        kubectl.kubernetes.io/default-container: firecracker-agent
    spec:
      serviceAccountName: fast-sandbox-firecracker-runtime
      # The janitor sidecar needs host PID visibility to kill leaked VMM
      # processes (fastlets delegate exact-ID cleanup over the node-cleanup
      # UDS socket). The agent container does not use it.
      hostPID: true
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      # The agent runs on the cluster network (NOT hostNetwork): its dart
      # child needs the cluster DNS (CoreDNS search domains) to resolve the
      # headless Service peers. It talks to fastlets over the shared UDS
      # hostPath and to MinIO over the cluster network, so no host network
      # capability is required. The node hostname file is mounted read-only
      # for the stable HRW self-id (hostNetwork used to provide it via the
      # node UTS namespace; a regular pod's hostname is its pod name).
      containers:
      - name: firecracker-agent
        image: fast-sandbox/firecracker-runtime:dev
        imagePullPolicy: IfNotPresent
        # Only Downward API identities live in env; all tunables come from
        # the mounted agent config (nodeReadiness hot-reloads per pass).
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: FAST_SANDBOX_AGENT_CONFIG
          value: /etc/fast-sandbox/agent-config/agent.yaml
        # Node readiness: spec.nodeName enables the host-check loop (the
        # KVM/storage/assets checks, the Firecracker asset install, the
        # scheduling labels and the FirecrackerReady condition).
        - name: FAST_SANDBOX_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # DART peer advertise: the dart peer-listen binds the pod IP and
        # the headless Service hands it out to peers.
        - name: FAST_SANDBOX_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        securityContext:
          privileged: true
        readinessProbe:
          exec:
            # $POD_UID must expand inside sh (double quotes): a single-quoted
            # body reaches the agent as a literal "$POD_UID".
            command: ["/bin/sh", "-ec", "curl -fsS -X POST --unix-socket /run/fast-sandbox/firecracker/runtime.sock -H 'Content-Type: application/json' -d \"{\\\"podUid\\\":\\\"$POD_UID\\\",\\\"namespace\\\":\\\"fast-sandbox-system\\\"}\" http://firecracker-agent/v1/health | grep -q '\"ok\":true'"]
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: agent-socket
          mountPath: /run/fast-sandbox/firecracker
        - name: agent-state
          mountPath: /var/lib/fast-sandbox/firecracker
        - name: agent-config
          mountPath: /etc/fast-sandbox/agent-config
          readOnly: true
        - name: agent-registry
          mountPath: /etc/fast-sandbox/agent
          readOnly: true
        - name: artifact-store
          mountPath: /etc/fast-sandbox/artifact-store
          readOnly: true
        - name: node-hostname
          mountPath: /etc/hostname
          readOnly: true
        - name: fc-assets
          mountPath: /opt/fast-sandbox/firecracker
      # Node janitor sidecar: sweeps orphaned fastlet network state (netns/
      # tap/veth), boxlite leftovers, and — the reason for hostPID — kills
      # leaked VMM processes fastlets delegate over the node-cleanup UDS
      # socket. The containerd backend is DISABLED here (--containerd-socket=):
      # this pod targets the firecracker runtime; the standalone
      # config/janitor DaemonSet keeps covering the containerd-based
      # runtimes.
      - name: janitor
        image: fast-sandbox/janitor:dev
        imagePullPolicy: IfNotPresent
        command: ["/workspace/janitor"]
        args: ["--scan-interval=2m", "--orphan-timeout=30s", "--containerd-socket="]
        ports:
        - name: metrics
          containerPort: 9092
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: network-state
          mountPath: /run/fast-sandbox/network
        - name: network-namespaces
          mountPath: /run/netns
          mountPropagation: Bidirectional
        - name: node-cleanup
          mountPath: /run/fast-sandbox/janitor
        - name: boxlite-state
          mountPath: /var/lib/fast-sandbox/boxlite
        - name: runtime-environments
          mountPath: /etc/fast-sandbox/runtime-environments
          readOnly: true
      volumes:
      - name: agent-socket
        hostPath:
          path: /run/fast-sandbox/firecracker
          type: DirectoryOrCreate
      - name: agent-state
        hostPath:
          path: /var/lib/fast-sandbox/firecracker
          type: DirectoryOrCreate
      # The agent config (config/dev/agent-config.yaml): the mounted file
      # hot-reloads the nodeReadiness section on every readiness pass.
      - name: agent-config
        configMap:
          name: fast-sandbox-firecracker-runtime-config
      - name: agent-registry
        secret:
          secretName: fast-sandbox-agent-registry
      # Shared artifact store root/endpoint, read per pull (live ConfigMap
      # edits land without an agent restart).
      - name: artifact-store
        configMap:
          name: fast-sandbox-artifact-store
          optional: true
      # The stable node identity for the HRW keyspace (hostNetwork used to
      # provide it through the node UTS namespace).
      - name: node-hostname
        hostPath:
          path: /etc/hostname
          type: File
      # The Firecracker assets the readiness manager installs (shared with
      # the fastlet pods via the runtime plan hostPath requirements).
      - name: fc-assets
        hostPath:
          path: /opt/fast-sandbox/firecracker
          type: DirectoryOrCreate
      # Node cleanup state the janitor sidecar sweeps: the fastlet network
      # state root, the host netns mount point, the boxlite state root, and
      # the node-cleanup socket dir shared with fastlet pods (the pool
      # controller injects the same hostPath into fastlets for the
      # exact-ID VMM process cleanup delegation).
      - name: network-state
        hostPath:
          path: /run/fast-sandbox/network
          type: DirectoryOrCreate
      - name: network-namespaces
        hostPath:
          path: /run/fast-sandbox/netns
          type: DirectoryOrCreate
      - name: node-cleanup
        hostPath:
          path: /run/fast-sandbox/janitor
          type: DirectoryOrCreate
      - name: boxlite-state
        hostPath:
          path: /var/lib/fast-sandbox/boxlite
          type: DirectoryOrCreate
      - name: runtime-environments
        configMap:
          name: fast-sandbox-runtime-environments
          # Optional: the firecracker integration env resolves runtime plans
          # from the built-in catalog and does not ship this ConfigMap; the
          # janitor falls back to its defaults (containerd backend is
          # disabled via --containerd-socket= anyway).
          optional: true
