apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-sandbox-controller
  namespace: fast-sandbox-system
  labels:
    fast-sandbox.io/control-plane-role: all
spec:
  replicas: 1
  template:
    metadata:
      labels:
        fast-sandbox.io/control-plane-role: all
    spec:
      containers:
      - name: manager
        args:
        - --role=all
        - --metrics-bind-address=:9091
        - --health-probe-bind-address=:5758
        - --fastpath-bind-address=:9090
        env:
        - name: FAST_SANDBOX_ROUTE_SIGNING_PRIVATE_KEY
          valueFrom:
            secretKeyRef: {name: fast-sandbox-route-keys, key: private-key}
        # Artifact store root (same as the node agents): lets FastPath
        # resolve snapshot-recorded action bindings (e.g. egress network
        # policy) from the published manifest at sandbox create time.
        - name: FAST_SANDBOX_ARTIFACT_STORE
          value: s3://sandbox-images/publish
        # Store endpoint override (scheme+port) for the same resolution;
        # optional so clusters without the agent config still start.
        - name: FAST_SANDBOX_ARTIFACT_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: fast-sandbox-agent-config
              key: artifact-endpoint
              optional: true
        ports:
        - {name: grpc, containerPort: 9090}
