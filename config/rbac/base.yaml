apiVersion: v1
kind: ServiceAccount
metadata:
  name: fast-sandbox-controller
  namespace: fast-sandbox-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fast-sandbox-fastpath
  namespace: fast-sandbox-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fast-sandbox-proxy
  namespace: fast-sandbox-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fast-sandbox-janitor
  namespace: fast-sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fast-sandbox-controller
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "create"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  # update: ensureBuilderRBAC converges pre-existing same-named Role /
  # RoleBinding back onto the enforced shape instead of trusting them.
  # list/watch: that convergence Get goes through the cached client, whose
  # informer cannot sync without them (the reconcile would stall forever on
  # every re-reconcile once the Role exists).
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
- apiGroups: ["node.k8s.io"]
  resources: ["runtimeclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["sandbox.fast.io"]
  resources: ["sandboxes", "sandboxpools", "sandboxtemplates", "sandboxsnapshots", "sandboxes/status", "sandboxpools/status", "sandboxtemplates/status", "sandboxsnapshots/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fast-sandbox-fastpath
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["sandbox.fast.io"]
  resources: ["sandboxpools"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["sandbox.fast.io"]
  resources: ["sandboxes", "sandboxes/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["sandbox.fast.io"]
  resources: ["sandboxsnapshots", "sandboxsnapshots/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fast-sandbox-proxy
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["sandbox.fast.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fast-sandbox-janitor
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["sandbox.fast.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fast-sandbox-controller
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fast-sandbox-controller}
subjects:
- {kind: ServiceAccount, name: fast-sandbox-controller, namespace: fast-sandbox-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fast-sandbox-fastpath
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fast-sandbox-fastpath}
subjects:
- {kind: ServiceAccount, name: fast-sandbox-fastpath, namespace: fast-sandbox-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fast-sandbox-proxy
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fast-sandbox-proxy}
subjects:
- {kind: ServiceAccount, name: fast-sandbox-proxy, namespace: fast-sandbox-system}
---
# Fastlet control authentication, two grants:
#
# 1. Token minting is namespaced on purpose: serviceaccounts/token RBAC is
#    evaluated in the target ServiceAccount's namespace, and resourceNames
#    matches the bare resource name, so a cluster-scoped rule would let a
#    compromised control plane mint tokens for same-named ServiceAccounts in
#    tenant namespaces. A Role + RoleBinding in the control-plane namespace
#    fences minting to the platform identities at the only namespace where
#    they exist.
# 2. The Fastlet verifies control-plane tokens locally against the issuer's
#    published keys and holds no Kubernetes credentials, so the OIDC
#    discovery and JWKS endpoints (non-resource paths served by the API
#    server) must be readable anonymously. system:service-account-issuer-
#    discovery is bound to system:serviceaccounts by default; this binding
#    extends it to unauthenticated callers, exposing exactly the two
#    public-key endpoints and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fast-sandbox-fastlet-token-minter
  namespace: fast-sandbox-system
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  resourceNames: ["fast-sandbox-fastpath", "fast-sandbox-controller"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fast-sandbox-fastlet-token-minter
  namespace: fast-sandbox-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fast-sandbox-fastlet-token-minter}
subjects:
- {kind: ServiceAccount, name: fast-sandbox-fastpath, namespace: fast-sandbox-system}
- {kind: ServiceAccount, name: fast-sandbox-controller, namespace: fast-sandbox-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fast-sandbox-fastlet-issuer-discovery
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:service-account-issuer-discovery}
subjects:
- {kind: Group, name: system:unauthenticated, apiGroup: rbac.authorization.k8s.io}
---
# The SandboxTemplate build Pod runs in the template's (tenant) namespace,
# owned by the template for cascading deletion. The controller provisions
# the builder ServiceAccount + Role + RoleBinding (pods/patch only, for the
# builder to self-report its outcome) per tenant namespace on demand; the
# controller ClusterRole above grants the create/get permissions it needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fast-sandbox-janitor
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fast-sandbox-janitor}
subjects:
- {kind: ServiceAccount, name: fast-sandbox-janitor, namespace: fast-sandbox-system}
