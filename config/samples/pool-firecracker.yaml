# pool-firecracker.yaml — SandboxPool backed by the Firecracker runtime.
#
# The controller resolves the firecracker runtime plan (config/runtime-
# environments.yaml), schedules a privileged fastlet on a node labeled
# fast-sandbox.io/firecracker-node=true, and auto-injects the runtime host
# paths (KVM, firecracker/jailer/kernel, state root, netns dirs) plus the
# runtime-plan / registry-config volumes. The fastletTemplate below only
# declares the fastlet image, the agent UDS socket mount and the agent env.
#
# warmImages trigger the agent PinImage pull (golden snapshot set from the
# artifact store); pool.Status.WarmImages turns Ready once cached on node.
#
# Capacity: poolMin=2 keeps TWO fastlet pods resident (10 slots total). This
# is required for the verify 7-sandbox batch: the fastpath create path
# rejects (ResourceExhausted) BEFORE creating the Sandbox CR when every
# fastlet is full, so a full pool can never trigger the controller's
# demand-driven scale-out (poolMax=2 is still the ceiling).
#
# Prerequisites:
#   - fast-sandbox-registry ConfigMap + dockerconfigjson Secret in this
#     namespace for the OCI registry of the warm image (optional for
#     firecracker; the snapshot pull goes through the agent/MinIO instead).
#   - Agent DaemonSet (config/dev/agent-daemonset.yaml): its readiness pass
#     checks the host, installs the firecracker assets and applies the
#     node labels below.
#
# Apply with:
#   kubectl apply -f config/samples/pool-firecracker.yaml
apiVersion: sandbox.fast.io/v1alpha2
kind: SandboxPool
metadata:
  name: firecracker-pool
  namespace: fast-sandbox-system
spec:
  fastletTemplate:
    spec:
      containers:
      - name: fastlet
        image: fast-sandbox/fastlet:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: FAST_SANDBOX_RUNTIME_AGENT_SOCKET
          value: /run/fast-sandbox/firecracker/runtime.sock
        # Live-snapshot dumps land on this fast spill area while the VM is
        # paused, then move to the StateRoot after the resume: the
        # business-visible pause window pays the spill area's bandwidth
        # instead of the (network-backed) StateRoot. sizeLimit must cover
        # the largest sandbox memory plus overhead (rule of thumb:
        # 2 × memory + 1Gi). This Memory-backed emptyDir suits test
        # clusters; production should prefer a local-NVMe hostPath — the
        # RAM-backed variant spends node memory equal to the dump. See
        # docs/guides/sandbox-snapshots.md.
        - name: FAST_SANDBOX_SNAPSHOT_SPILL_DIR
          value: /spill
        volumeMounts:
        - name: agent-socket
          mountPath: /run/fast-sandbox/firecracker
        - name: snapshot-spill
          mountPath: /spill
      volumes:
      - name: agent-socket
        hostPath:
          path: /run/fast-sandbox/firecracker
          type: DirectoryOrCreate
      - name: snapshot-spill
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      nodeSelector:
        fast-sandbox.io/firecracker-node: "true"
      # P2P is the standard topology: the pool keeps ONE fastlet per node
      # (podAntiAffinity spreads the poolMin=2 fastlets across the two
      # firecracker nodes), so the warmImages preheat on each node pulls
      # through the node-local DART peer of the OTHER node — the second
      # pull is the P2P event the stage-2 assertions measure. On a single
      # node this is a no-op (only one eligible node exists).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sandbox-fastlet
              topologyKey: kubernetes.io/hostname
  capacity:
    poolMin: 2
    poolMax: 2
    bufferMin: 0
    bufferMax: 0
  maxSandboxesPerPod: 5
  runtime: firecracker
  # No infraComponents: execd is already BAKED into the golden snapshot by
  # the SandboxTemplate builder (spec.execd), so no GuestCopy delivery (and
  # no containerd pull) is needed. The proxy e2e probes execd /ping via the
  # PORT route (ResolveEndpoint port 44772 -> sandbox-proxy -> fastlet-proxy
  # -> guest), which does not require a declared component.
  sandboxResources:
    cpu: "1"
    memory: 512Mi
    pids: 128
  # warmImages lookups are byte-exact (the agent resolves index/<sha256(image)>,
  # no normalization), so this entry MUST match the built template's
  # spec.image. The integration environment renders it to its (possibly
  # mirror-rewritten) SBX_IMAGE before applying; keep the default in sync
  # when applying the sample by hand.
  warmImages:
  - alpine:3.19
