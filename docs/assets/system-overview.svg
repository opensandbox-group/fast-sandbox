<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title description">
  <title id="title">Fast Sandbox: Firecracker microVMs on Kubernetes</title>
  <desc id="description">OpenSandbox Server connects to the Fast Sandbox Fast-Path for placement and direct creation. Kubernetes CRDs persist intent and reconcilers converge lifecycle and Pool capacity. A warm Fastlet Pod on a KVM worker hosts multiple isolated Firecracker microVMs. Application traffic passes through OpenSandbox Ingress and Fastlet Proxy. A SandboxTemplate builder publishes reusable snapshots to an artifact store; snapshot delivery groups P2P caching with OverlayBD and ublk snapshot on-demand loading.</desc>
  <defs>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="traffic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#13876c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="artifact-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#af6c16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #152b45; }
      .headline { font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #526277; }
      .group-title { font-size: 27px; font-weight: 650; }
      .title { font-size: 26px; font-weight: 650; }
      .note { font-size: 20px; fill: #526277; }
      .vm-title { font-size: 22px; font-weight: 650; }
      .vm-note { font-size: 19px; fill: #3c6559; }
      .edge-label { font-size: 20px; font-weight: 550; }
      .control { fill: none; stroke: #2563eb; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#control-arrow); }
      .traffic { fill: none; stroke: #13876c; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#traffic-arrow); }
      .artifact { fill: none; stroke: #af6c16; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#artifact-arrow); }
      .control-label { fill: #2563eb; }
      .traffic-label { fill: #13876c; }
      .artifact-label { fill: #95601c; }
    </style>
  </defs>
