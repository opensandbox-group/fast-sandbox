<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Fast Sandbox system overview</title>
  <desc id="description">Fast Sandbox control plane and data plane, from network-slot management to Sandbox-private networking and pluggable Infra Components, on a Kubernetes foundation.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e7e7e4" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    </marker>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .sans {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .product {
        fill: #18181b;
        font-size: 24px;
        font-weight: 600;
      }
      .breadcrumb {
        fill: #71717a;
        font-size: 17px;
        font-weight: 400;
      }
      .section {
        fill: #71717a;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      .node-title {
        fill: #18181b;
        font-size: 20px;
        font-weight: 500;
      }
      .node-note {
        fill: #71717a;
        font-size: 13px;
        font-weight: 400;
      }
      .runtime {
        fill: #52525b;
        font-size: 12px;
        font-weight: 400;
      }
      .sandbox-title {
        fill: #18181b;
        font-size: 15px;
        font-weight: 500;
      }
      .sandbox-note {
        fill: #71717a;
        font-size: 11px;
        font-weight: 400;
      }
      .control-detail {
        fill: #52525b;
        font-size: 10px;
        font-weight: 400;
      }
      .foundation-title {
        fill: #172554;
        font-size: 28px;
        font-weight: 500;
      }
      .foundation-note {
        fill: #475569;
        font-size: 14px;
        font-weight: 400;
      }
      .foundation-token {
        fill: #1e3a8a;
        font-size: 12px;
        font-weight: 500;
      }
    </style>
  </defs>

  <rect width="1440" height="760" fill="#fbfbfa"/>
  <rect width="1440" height="760" fill="url(#grid)" opacity="0.48"/>
  <rect x="24" y="24" width="1392" height="712" rx="10" fill="none" stroke="#d4d4d0"/>

  <circle cx="62" cy="57" r="5" fill="#22c55e"/>
  <text x="78" y="64" class="mono product">fast-sandbox</text>
  <text x="260" y="64" class="mono breadcrumb">/ system overview</text>
  <text x="1378" y="63" text-anchor="end" class="mono breadcrumb">kubernetes-native runtime plane</text>
  <line x1="48" y1="88" x2="1392" y2="88" stroke="#d4d4d0"/>

  <text x="64" y="125" class="mono section">01 / control plane</text>
  <line x1="64" y1="142" x2="1376" y2="142" stroke="#d4d4d0" stroke-dasharray="3 6"/>

  <rect x="64" y="168" width="236" height="104" rx="7" fill="#fbfbfa" stroke="#a1a1aa"/>
  <text x="86" y="213" class="mono node-title">fastctl / SDK</text>
  <text x="86" y="241" class="mono node-note">imperative API client</text>

  <line x1="300" y1="220" x2="360" y2="220" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <g transform="translate(-64 0)">
  <rect x="434" y="168" width="360" height="104" rx="7" fill="#fbfbfa" stroke="#a1a1aa"/>
  <text x="456" y="202" class="mono node-title">fast-path × N / reconciler</text>
  <text x="456" y="229" class="mono node-note">multi-active / leader-elected</text>
  <text x="456" y="253" class="mono runtime">Top-K · image affinity / converge state</text>

  <rect x="854" y="154" width="586" height="142" rx="8" fill="#f8fbff" fill-opacity="0.58" stroke="#93c5fd" stroke-dasharray="4 4"/>
  <text x="870" y="176" class="mono section" fill="#2563eb">Fastlet Pod</text>

  <line x1="794" y1="220" x2="874" y2="220" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="884" y="187" width="166" height="94" rx="5" fill="#fbfbfa" stroke="#a1a1aa"/>
  <text x="967" y="211" text-anchor="middle" class="mono sandbox-title">Fastlet</text>
  <text x="967" y="233" text-anchor="middle" class="mono sandbox-note">admission · runtime</text>
  <text x="967" y="252" text-anchor="middle" class="mono sandbox-note">network · image cache</text>
  <text x="967" y="271" text-anchor="middle" class="mono sandbox-note">Infra · recovery</text>

  <line x1="1050" y1="234" x2="1134" y2="234" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="1144" y="181" width="276" height="106" rx="5" fill="#fbfbfa" stroke="#93c5fd"/>
  <text x="1160" y="204" class="mono sandbox-title">Sandbox</text>
  <text x="1160" y="226" class="mono sandbox-note">user workload + Infra Component</text>
  <text x="1160" y="249" class="mono control-detail">
    <tspan>runc · gVisor · Kata · Firecracker</tspan>
  </text>
  <text x="1160" y="271" class="mono control-detail">network slot · private network</text>
  </g>

  <text x="64" y="329" class="mono section">02 / data plane</text>
  <line x1="64" y1="346" x2="1376" y2="346" stroke="#d4d4d0" stroke-dasharray="3 6"/>

  <rect x="64" y="386" width="236" height="96" rx="7" fill="#fbfbfa" stroke="#a1a1aa"/>
  <text x="86" y="426" class="mono node-title">fastctl / SDKs</text>
  <text x="86" y="454" class="mono node-note">native · OpenSandbox</text>

  <line x1="300" y1="434" x2="360" y2="434" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <g transform="translate(-40 0)">
  <rect x="410" y="386" width="250" height="96" rx="7" fill="#fbfbfa" stroke="#a1a1aa"/>
  <text x="432" y="420" class="mono node-title">Data-plane entry</text>
  <text x="432" y="447" class="mono node-note">Sandbox Proxy · central</text>
  <text x="432" y="469" class="mono node-note">OpenSandbox · direct</text>
  </g>

  <g transform="translate(-64 0)">
  <rect x="724" y="360" width="716" height="142" rx="8" fill="#faf8ff" fill-opacity="0.45" stroke="#c4b5fd" stroke-dasharray="4 5"/>
  <text x="744" y="379" class="mono section" fill="#7c3aed">Fastlet Pod</text>

  <line x1="684" y1="434" x2="744" y2="434" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <rect x="754" y="394" width="230" height="80" rx="7" fill="#fbfbfa" stroke="#a1a1aa"/>
  <text x="776" y="426" class="mono node-title">Fastlet Proxy</text>
  <text x="776" y="454" class="mono node-note">pod-local named routing</text>

  <line x1="984" y1="434" x2="1074" y2="434" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <rect x="1084" y="374" width="336" height="100" rx="7" fill="#f8fbff" stroke="#93c5fd" stroke-dasharray="4 4"/>
  <text x="1100" y="394" class="mono section" fill="#2563eb">Sandbox · private network</text>

  <rect x="1098" y="405" width="130" height="56" rx="5" fill="#fbfbfa" stroke="#cbd5e1"/>
  <text x="1163" y="429" text-anchor="middle" class="mono sandbox-title">user workload</text>
  <text x="1163" y="449" text-anchor="middle" class="mono sandbox-note">OCI image</text>

  <rect x="1242" y="405" width="164" height="56" rx="5" fill="#fbfbfa" stroke="#c4b5fd"/>
  <text x="1324" y="429" text-anchor="middle" class="mono sandbox-title">Infra Component</text>
  <text x="1324" y="449" text-anchor="middle" class="mono sandbox-note">execd · envd · custom</text>

  <text x="869" y="494" text-anchor="middle" class="mono control-detail">ingress · transparent / no translation</text>
  <text x="1252" y="494" text-anchor="middle" class="mono control-detail">egress · private CIDR → MASQUERADE → Pod network</text>
  </g>

  <rect x="64" y="548" width="1312" height="142" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="88" y="582" class="mono section" fill="#3b82f6">03 / foundation</text>
  <text x="88" y="632" class="mono foundation-title">built on Kubernetes</text>
  <text x="88" y="663" class="mono foundation-note">portable control, durable state, native operations</text>

  <rect x="680" y="570" width="200" height="40" rx="5" fill="#f8fbff" stroke="#bfdbfe"/>
  <text x="780" y="595" text-anchor="middle" class="mono foundation-token">[ Sandbox CRD ]</text>
  <rect x="896" y="570" width="200" height="40" rx="5" fill="#f8fbff" stroke="#bfdbfe"/>
  <text x="996" y="595" text-anchor="middle" class="mono foundation-token">[ SandboxPool CRD ]</text>
  <rect x="1112" y="570" width="200" height="40" rx="5" fill="#f8fbff" stroke="#bfdbfe"/>
  <text x="1212" y="595" text-anchor="middle" class="mono foundation-token">[ Runtime · Kata / gVisor ]</text>

  <rect x="788" y="624" width="200" height="40" rx="5" fill="#f8fbff" stroke="#bfdbfe"/>
  <text x="888" y="649" text-anchor="middle" class="mono foundation-token">[ Fastlet Pods ]</text>
  <rect x="1004" y="624" width="200" height="40" rx="5" fill="#f8fbff" stroke="#bfdbfe"/>
  <text x="1104" y="649" text-anchor="middle" class="mono foundation-token">[ NodeJanitor DaemonSet ]</text>
</svg>
